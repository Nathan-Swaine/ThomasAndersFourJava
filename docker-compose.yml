services:
  neo4j:
    image: neo4j:5.6
    container_name: thomas-anders-four-java-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 512M
    volumes:
      - neo4j-data:/data

  mongodb:
    image: mongo:7.0
    container_name: thomas-anders-four-java-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  neo4j-data:
  mongo-data:

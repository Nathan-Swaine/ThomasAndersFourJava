services:
  neo4j:
    image: neo4j:5.6
    container_name: thomas-anders-four-java-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_server_memory_pagecache_size: 4G
      NEO4J_server_memory_heap_initial__size: 1500m
      NEO4J_server_memory_heap_max__size: 1500m
      NEO4J_db_checkpoint_iops_limit: -1
      NEO4J_db_tx__log_rotation_retention__policy: "1 files"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      # Neo4j needs write access here during startup because it adjusts ownership
      # inside the import directory before the database comes online.
      - ./neo4j/import:/var/lib/neo4j/import/seed

  # init sidecar: waits for Neo4j then imports .cypher, .json, and .csv files from the import directory
  neo4j-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: neo4j-init-runner
    container_name: thomas-anders-four-java-neo4j-init
    env_file:
      - ./project.env
    depends_on:
      - neo4j
    volumes:
      # mount the import directory to /data so seed files are imported from neo4j/import
      - ./neo4j/import:/data
      # mount the helper script from the repo root into the container
      - ./wait-and-import.sh:/import/wait-and-import.sh:ro
    entrypoint: ["/bin/sh","-c","tr -d '\\r' </import/wait-and-import.sh | /bin/sh"]

  # Ephemeral Gaffer pipeline service: converts CSV, then imports into Neo4j
  gaffer-batch:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: thomas-anders-four-java-gaffer-batch
    env_file:
      - ./project.env
    environment:
      IMPORT_DIR: /data
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jpassword
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
    volumes:
      - ./neo4j/import:/data
    networks:
      - default
    profiles:
      - gaffer-manual
    # Service exits after job completes - no restart policy needed

volumes:
  neo4j-data:

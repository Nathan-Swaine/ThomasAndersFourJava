version: '3.8'

services:
  neo4j:
    image: neo4j:5.6
    container_name: thomas-anders-four-java-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 512M
    volumes:
      - neo4j-data:/data
      # host import directory used by Neo4j LOAD CSV (file:///seed/...)
      - ./neo4j/import:/var/lib/neo4j/import/seed:ro

  # init sidecar: waits for Neo4j to be available then runs any .cypher files in the import directory
  neo4j-init:
    image: neo4j:5.6
    container_name: thomas-anders-four-java-neo4j-init
    depends_on:
      - neo4j
    volumes:
      # mount the import directory (same host path as above)
      - ./neo4j/import:/import/data:ro
      # mount the helper script from the repo root into the container
      - ./wait-and-import.sh:/import/wait-and-import.sh:ro
    entrypoint: ["/bin/sh","-c","tr -d '\\r' </import/wait-and-import.sh | /bin/sh"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/neo4jpassword

volumes:
  neo4j-data:
